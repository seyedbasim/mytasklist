name: Deploy to Azure App Service

# Optional CI/CD pipeline. To use it:
#   1. In the Azure Portal, open your App Service -> Get publish profile, download the file.
#   2. In GitHub, add its contents as a repository secret named AZURE_WEBAPP_PUBLISH_PROFILE.
#   3. Set AZURE_WEBAPP_NAME below to your App Service name.
#   4. Push to the "main" branch to trigger a deployment.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: my-task-lists # <-- change to your App Service name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
