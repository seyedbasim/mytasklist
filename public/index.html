<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasks</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232e7d32'/%3E%3Cpath d='M6.5 12.5l3.5 3.5 7.5-8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="container">
    <div class="day-header">
      <button id="prev-day" class="icon-btn" title="Previous day">&larr;</button>
      <input type="date" id="date-picker" />
      <button id="next-day" class="icon-btn" title="Next day">&rarr;</button>
      <button id="today-btn" class="secondary-btn">Today</button>
      <div class="day-progress">
        <span id="progress-text">0 / 0 done</span>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </div>
    </div>

    <div class="label-bar">
      <div id="label-filters" class="label-filters"></div>
      <button id="manage-labels-btn" class="link-btn small">Manage labels</button>
    </div>
    <div id="label-manager" class="label-manager" hidden>
      <div id="label-list" class="label-list"></div>
      <div class="label-form">
        <input type="text" id="new-label-name" placeholder="Label name" maxlength="24" />
        <div id="color-swatches" class="color-swatches"></div>
        <button id="add-label-btn" class="secondary-btn">Add label</button>
      </div>
    </div>

    <table class="task-table">
      <thead>
        <tr>
          <th class="col-check"></th>
          <th class="col-label">Label</th>
          <th class="col-time">Time</th>
          <th class="col-title">Task</th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody id="task-rows"></tbody>
      <tfoot>
        <tr class="add-row">
          <td class="col-check"></td>
          <td class="col-label"><select id="new-label"></select></td>
          <td class="col-time"><input type="time" id="new-time" /></td>
          <td class="col-title"><input type="text" id="new-title" placeholder="Add a task and press Enter…" /></td>
          <td class="col-actions"><button id="add-btn" class="primary-btn">Add</button></td>
        </tr>
      </tfoot>
    </table>
    <p id="empty-state" class="empty-state" hidden>No tasks for this day yet.</p>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
