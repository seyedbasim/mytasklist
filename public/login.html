<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasks</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232e7d32'/%3E%3Cpath d='M6.5 12.5l3.5 3.5 7.5-8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <h1>Basim's Tasks</h1>
    <p class="subtitle" id="subtitle">Sign in with your passkey</p>

    <button id="passkey-btn" class="primary-btn passkey-btn" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2a5 5 0 0 0-5 5c0 2 1 3.5 2 4.3V13H7v2H5v2H3v3a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2h2v-2h1.7c.8-1 2.3-2.9 2.3-5a5 5 0 0 0-5-5Zm2 5.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z" fill="currentColor"/>
      </svg>
      Sign in with Passkey
    </button>

    <form id="login-form" hidden>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      <button type="submit" class="primary-btn">Sign in</button>
    </form>
    <p id="error" class="error-text" hidden></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@13.3.0/dist/bundle/index.umd.min.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
